services:
  - type: web
    name: siba-automation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SIBA_ENCRYPT_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SIBA_ENV
        value: dev
      - key: SIBA_WSDL_DEV
        sync: false
      - key: SIBA_WSDL_PROD
        sync: false

