<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sessão Expirada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md text-center max-w-md w-full border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-2">Sessão Expirada</h2>
        <p class="text-sm text-slate-500 mb-6">
            A sua sessão terminou ou o cookie expirou. Por favor, autentique-se novamente para continuar.
        </p>
        <a href="/login" class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200">
            Ir para a Página de Login
        </a>
    </div>
</body>
</html>
