<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registo de Anfitrião | SIBA Automation</title>
    <script src="https://cdn.tailwindcss.com">
        </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <!-- Logótipo / Cabeçalho -->
    <div class="sm:mx-auto sm:w-full sm:max-w-lg text-center">
        <a href="/" class="inline-flex items-center gap-2 font-bold text-2xl text-blue-600 tracking-tight">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>SIBA<span class="text-slate-900">Automation</span></span>
        </a>
        <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">Criar Nova Conta</h2>
        <p class="mt-2 text-sm text-slate-600">
            Registe o seu alojamento e automatize a submissão de boletins
        </p>
    </div>

    <!-- Contentor do Formulário -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-lg px-4 sm:px-0">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-xl sm:px-10">
            
            <!-- Mensagem de feedback/erro (placeholder) -->
            <div id="registerFeedback" class="hidden mb-4 p-3 rounded text-sm bg-red-50 text-red-700 border border-red-200"></div>

            <form id="registerForm" class="space-y-4">
                
                <!-- Nome Completo / Entidade -->
                <div>
                    <label for="fullName" class="block text-sm font-medium text-slate-700">Nome Completo / Empresa</label>
                    <div class="mt-1">
                        <input 
                            type="text" 
                            id="fullName" 
                            name="full_name" 
                            required 
                            placeholder="Ex: Maria Santos ou Alojamentos Lda." 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                        />
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email de Contacto</label>
                    <div class="mt-1">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            autocomplete="email"
                            placeholder="host@exemplo.pt" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                        />
                    </div>
                </div>

                <!-- Palavra-passe e Confirmação -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700">Palavra-passe</label>
                        <div class="mt-1">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required 
                                minlength="8"
                                placeholder="Mín. 8 caracteres" 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                            />
                        </div>
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirmar Senha</label>
                        <div class="mt-1">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirm_password" 
                                required 
                                placeholder="Repita a senha" 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                            />
                        </div>
                    </div>
                </div>



                <!-- Termos e Condições -->
                <div class="pt-2">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input 
                                id="termsAccepted" 
                                name="terms_accepted" 
                                type="checkbox" 
                                required 
                                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                            />
                        </div>
                        <div class="ml-2 text-xs leading-snug">
                            <label for="termsAccepted" class="text-slate-600">
                                Concordo com os <a href="/terms" target="_blank" class="text-blue-600 hover:underline">Termos de Utilização</a> e a <a href="/privacy" target="_blank" class="text-blue-600 hover:underline">Política de Privacidade</a> do SIBA Automation.
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Botão de Criação de Conta -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="registerSubmitBtn"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                    >
                        Criar Conta
                    </button>
                </div>
            </form>

            <div class="mt-6 border-t border-slate-100 pt-4 text-center">
                <p class="text-xs text-slate-600">
                    Já tem uma conta registada? 
                    <a href="/login" class="font-medium text-blue-600 hover:text-blue-700">Entrar</a>
                </p>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-slate-600 transition-colors">
                ← Voltar à página inicial
            </a>
        </div>
    </div>
    <script src="/static/js/register.js"></script>
</body>
</html>
