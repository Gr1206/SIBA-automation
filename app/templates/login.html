<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | SIBA Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', path='js/login.js') }}"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <!-- Logótipo / Cabeçalho -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="/" class="inline-flex items-center gap-2 font-bold text-2xl text-blue-600 tracking-tight">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>SIBA<span class="text-slate-900">Automation</span></span>
        </a>
        <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">Iniciar Sessão</h2>
        <p class="mt-2 text-sm text-slate-600">
            Aceda ao seu painel de gestão de boletins
        </p>
    </div>

    <!-- Contentor do Formulário -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-xl sm:px-10">
            
            <!-- Mensagem de feedback/erro genérica (placeholder) -->
            <div id="loginFeedback" class="hidden mb-4 p-3 rounded text-sm bg-red-50 text-red-700 border border-red-200"></div>

            <form id="loginForm" class="space-y-5" onsubmit="event.preventDefault();">
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email de Utilizador</label>
                    <div class="mt-1">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            autocomplete="email"
                            placeholder="exemplo@siba.local" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                        />
                    </div>
                </div>

                <!-- Palavra-passe -->
                <div>
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-sm font-medium text-slate-700">Palavra-passe</label>
                        <a href="/forgot-password" class="text-xs text-blue-600 hover:text-blue-700 font-medium">Esqueceu-se?</a>
                    </div>
                    <div class="mt-1">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            autocomplete="current-password"
                            placeholder="••••••••" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                        />
                    </div>
                </div>
                <!-- Botão de Submissão -->
                <div>
                    <button 
                        type="submit" 
                        id="loginSubmitBtn"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                    >
                        Entrar na Plataforma
                    </button>
                </div>
            </form>

            <div class="mt-6 border-t border-slate-100 pt-4 text-center">
                <p class="text-xs text-slate-600">
                    Ainda não tem conta? 
                    <a href="/register" class="font-medium text-blue-600 hover:text-blue-700">Criar conta grátis</a>
                </p>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-slate-600 transition-colors">
                ← Voltar à página inicial
            </a>
        </div>
    </div>

</body>
</html>
